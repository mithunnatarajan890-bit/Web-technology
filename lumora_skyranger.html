<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#02040d">
<title>Lumora — Cadet Skyranger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@1,94,900&family=Urbanist:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--u:max(100vw/1440,100vh/810);--page:#02040d;--muted:#cdd2e6;--white:#fff}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--page);color:var(--white);font-family:"Urbanist",sans-serif}
button{font:inherit}
.stage{position:fixed;inset:0;overflow:hidden;background:#02040d}
.frame{position:absolute;width:calc(1440 * var(--u));height:calc(810 * var(--u));left:calc(50% - 720 * var(--u));top:calc(50% - 405 * var(--u));overflow:hidden;isolation:isolate}
.plate{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;user-select:none;pointer-events:none}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,4,13,.24),transparent 48%,rgba(2,4,13,.05));pointer-events:none}
.logo{position:absolute;left:calc(55 * var(--u));top:calc(43 * var(--u));display:flex;align-items:center;gap:calc(11 * var(--u));font-size:calc(29.5 * var(--u));font-weight:600;letter-spacing:-.04em;opacity:0}
.logo-mark{width:calc(35 * var(--u));height:calc(35 * var(--u));border-radius:50%;background:conic-gradient(#3df2ff,#4382ff,#8c55ff,#f55dbb,#3df2ff);box-shadow:0 0 calc(22 * var(--u)) #4e8bff80}
.menu{position:absolute;right:calc(57 * var(--u));top:calc(54 * var(--u));width:calc(25 * var(--u));height:calc(25 * var(--u));padding:0;border:0;background:none;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;opacity:0}
.menu span{height:calc(2.2 * var(--u));width:100%;border-radius:9px;background:white}
.copy{position:absolute;top:calc(120 * var(--u));left:0;width:100%;text-align:center;pointer-events:none}
.eyebrow{margin:0;color:var(--muted);font-size:calc(18 * var(--u));font-weight:700;letter-spacing:.9em;transform:translateX(.45em);opacity:0}
h1{margin:calc(10 * var(--u)) 0 0;font-family:"Archivo",sans-serif;font-size:calc(100 * var(--u));font-style:italic;font-weight:900;line-height:.98;letter-spacing:-.02em;white-space:nowrap;color:#fff;text-shadow:0 0 calc(14 * var(--u)) #fff,0 0 calc(34 * var(--u)) #b8d7ff,0 0 calc(70 * var(--u)) #367cff;opacity:0}
.subtitle{margin:calc(9 * var(--u)) 0 0;color:var(--muted);font-size:calc(23 * var(--u));font-weight:600;opacity:0}
.head-clip{position:absolute;left:calc(510 * var(--u));top:calc(255 * var(--u));width:calc(435 * var(--u));height:calc(450 * var(--u));object-fit:fill;opacity:0;pointer-events:none;mask-image:radial-gradient(ellipse 50% 50% at 50% 46%,#000 0 72%,transparent 99%);-webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 46%,#000 0 72%,transparent 99%);transition:opacity .6s ease}
.helmet{position:absolute;left:calc(533 * var(--u));top:calc(288 * var(--u));width:calc(360 * var(--u));height:calc(360 * var(--u));object-fit:fill;mix-blend-mode:screen;opacity:0;pointer-events:none;mask-image:linear-gradient(to bottom,#000 0 76%,transparent 92%);-webkit-mask-image:linear-gradient(to bottom,#000 0 76%,transparent 92%);transform:translateY(calc(-70 * var(--u))) scale(.98);transform-origin:50% 10%}
.push{position:absolute;left:calc(675 * var(--u));top:calc(720 * var(--u));width:calc(75 * var(--u));height:calc(75 * var(--u));border-radius:50%;border:calc(4 * var(--u)) solid #5d1018;background:radial-gradient(circle at 32% 23%,#ff8b8b 0,#ff303b 28%,#d70d24 66%,#710817 100%);box-shadow:0 0 0 calc(1.2 * var(--u)) #ffffff88,0 calc(4 * var(--u)) calc(10 * var(--u)) #0009,inset 0 calc(2 * var(--u)) calc(3 * var(--u)) #ffffff88;display:flex;align-items:center;justify-content:center;flex-direction:column;color:white;font-size:calc(16.5 * var(--u));font-weight:700;line-height:.95;cursor:pointer;opacity:0;z-index:5;transition:box-shadow .25s ease,filter .25s ease}
.push:focus-visible{outline:2px solid white;outline-offset:5px}
.push[aria-pressed="true"]{box-shadow:0 0 0 calc(1.2 * var(--u)) #fff9,0 0 calc(25 * var(--u)) #ff1c39,inset 0 calc(2 * var(--u)) calc(3 * var(--u)) #ffffff88;filter:saturate(1.2)}
.captions{position:absolute;left:calc(55 * var(--u));right:calc(55 * var(--u));bottom:calc(49 * var(--u));display:flex;align-items:center;justify-content:space-between;color:#fff;font-size:calc(12.2 * var(--u));font-weight:700;opacity:0}
.cursor-dot,.cursor-ring{position:fixed;left:0;top:0;pointer-events:none;z-index:20;opacity:0}
.cursor-dot{width:7px;height:7px;border-radius:50%;background:white;transform:translate(-50%,-50%)}
.cursor-ring{width:44px;height:44px;border:1.5px solid #ffffffd9;border-radius:50%;transform:translate(-50%,-50%);transition:width .18s,height .18s}
body.fine-pointer .stage{cursor:none}
body.fine-pointer .menu,body.fine-pointer .push{cursor:none}
@media(max-width:820px){
 .logo{left:20px;top:19px;gap:8px;font-size:21px}
 .logo-mark{width:27px;height:27px}
 .menu{right:21px;top:24px;width:22px;height:19px}
 .copy{top:104px;padding:0 10px}
 .eyebrow{font-size:14px;letter-spacing:.46em;transform:none}
 h1{font-size:clamp(40px,8.5vw,64px);margin-top:12px;letter-spacing:-.03em}
 .subtitle{font-size:16px;margin-top:10px}
 .captions{left:20px;right:20px;bottom:20px;font-size:11px}
 .push{width:calc(75 * var(--u));height:calc(75 * var(--u))}
}
@media(prefers-reduced-motion:reduce){.head-clip{display:none}.cursor-ring{transition:none}}
</style>
</head>
<body>
<main class="stage" id="stage" aria-label="Lumora Cadet Skyranger interactive hero">
  <div class="frame" id="frame">
    <img class="plate" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/a194141a-44ba-44bb-8372-e6720af994ca.jpg" alt="">
    <div class="shade"></div>
    <div class="logo" id="logo"><span class="logo-mark" aria-hidden="true"></span><span>Lumora</span></div>
    <button class="menu" id="menu" aria-label="Open menu"><span></span><span></span><span></span></button>
    <section class="copy" aria-label="Cadet Skyranger">
      <p class="eyebrow" id="eyebrow">CADET</p>
      <h1 id="headline">SKYRANGER</h1>
      <p class="subtitle" id="subtitle">Past the Stars and Further</p>
    </section>
    <video class="head-clip" id="headClip" muted playsinline preload="auto" aria-hidden="true">
      <source src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/e1b48476-24ab-456a-bb12-13e63bc60973.mp4" type="video/mp4">
    </video>
    <img class="helmet" id="helmet" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/e8c78660-4497-41b9-82ae-a4738a5edd11.jpg" alt="">
    <button class="push" id="push" aria-pressed="false" aria-label="Toggle cadet helmet"><span>PUSH</span><span>ME</span></button>
    <div class="captions" id="captions"><span>3D Interaction</span><span>@studio.design</span></div>
  </div>
</main>
<div class="cursor-dot" id="cursorDot"></div><div class="cursor-ring" id="cursorRing"></div>
<script>
(() => {
 const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
 const stage = document.getElementById('stage');
 const frame = document.getElementById('frame');
 const video = document.getElementById('headClip');
 const helmet = document.getElementById('helmet');
 const push = document.getElementById('push');
 const dot = document.getElementById('cursorDot');
 const ring = document.getElementById('cursorRing');
 const $ = id => document.getElementById(id);
 let targetTime = 0, shownTime = 0, lastMove = performance.now();
 let pointerX = innerWidth / 2, pointerY = innerHeight / 2;
 let ringX = pointerX, ringY = pointerY, hasSought = false, helmetOn = false;
 const finePointer = matchMedia('(pointer:fine)').matches;
 if (finePointer) document.body.classList.add('fine-pointer');

 // Download the complete clip before seeking, so scrubbing does not wait on network chunks.
 (async () => {
   const source = 'https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/e1b48476-24ab-456a-bb12-13e63bc60973.mp4';
   try {
     const response = await fetch(source, {mode:'cors'});
     if (!response.ok) throw new Error('Clip fetch failed');
     const blob = await response.blob();
     video.src = URL.createObjectURL(blob);
   } catch (_) {
     video.src = source;
   }
   video.load();
 })();

 video.addEventListener('loadedmetadata', () => {
   shownTime = targetTime = 0;
   if (reduced) return;
   seek(0);
 });
 video.addEventListener('seeked', () => {
   if (!hasSought && !reduced) {
     hasSought = true;
     video.style.opacity = '1';
   }
 });
 function seek(t) {
   if (!Number.isFinite(video.duration) || video.duration <= 0 || video.seeking) return;
   const next = Math.max(0, Math.min(video.duration - .001, t));
   if (Math.abs(video.currentTime - next) > .012) {
     try { video.currentTime = next; } catch (_) {}
   }
 }
 function updateTarget(now) {
   const rect = frame.getBoundingClientRect();
   const localX = (pointerX - rect.left) / rect.width;
   if (now - lastMove > 3500) {
     targetTime = (video.duration || 5.04) * (.5 + Math.sin(now / 1900) * .32);
   } else {
     const normalized = Math.max(0, Math.min(1, (localX - .14) / .72));
     targetTime = normalized * (video.duration || 5.04);
   }
 }
 function animate(now) {
   updateTarget(now);
   if (!reduced && video.readyState >= 2 && Number.isFinite(video.duration) && video.duration > 0) {
     shownTime += (targetTime - shownTime) * .14;
     seek(shownTime);
   }
   if (finePointer) {
     ringX += (pointerX - ringX) * .55;
     ringY += (pointerY - ringY) * .55;
     dot.style.left = pointerX + 'px'; dot.style.top = pointerY + 'px';
     ring.style.left = ringX + 'px'; ring.style.top = ringY + 'px';
   }
   requestAnimationFrame(animate);
 }
 requestAnimationFrame(animate);

 window.addEventListener('pointermove', e => {
   pointerX = e.clientX; pointerY = e.clientY; lastMove = performance.now();
   if (finePointer) { dot.style.opacity = '1'; ring.style.opacity = '1'; }
 }, {passive:true});
 window.addEventListener('pointerleave', () => { dot.style.opacity = '0'; ring.style.opacity = '0'; });
 stage.addEventListener('pointerenter', () => { if (finePointer) {dot.style.opacity='1';ring.style.opacity='1';} });
 stage.addEventListener('pointerleave', () => { if (finePointer) {dot.style.opacity='0';ring.style.opacity='0';} });

 function toggleHelmet() {
   helmetOn = !helmetOn;
   push.setAttribute('aria-pressed', String(helmetOn));
   push.animate([{transform:'scale(1)'},{transform:'scale(.88)'},{transform:'scale(1)'}],{duration:320,easing:'ease-out'});
   helmet.animate(
     helmetOn
       ? [{opacity:0,transform:`translateY(calc(-70 * var(--u))) scale(.98)`},{opacity:1,transform:'translateY(calc(5 * var(--u))) scale(1.015)',offset:.78},{opacity:1,transform:'translateY(0) scale(1)'}]
       : [{opacity:1,transform:'translateY(0) scale(1)'},{opacity:0,transform:`translateY(calc(-70 * var(--u))) scale(.98)`}],
     {duration:720,easing:helmetOn?'cubic-bezier(.2,.8,.2,1)':'cubic-bezier(.4,0,.8,.3)',fill:'forwards'}
   );
   if (!helmetOn) helmet.style.opacity = '0';
   else helmet.style.opacity = '1';
 }
 push.addEventListener('click', toggleHelmet);
 $('menu').addEventListener('click', () => {
   const open = $('menu').getAttribute('aria-expanded') === 'true';
   $('menu').setAttribute('aria-expanded', String(!open));
   $('menu').setAttribute('aria-label', open ? 'Open menu' : 'Close menu');
   $('menu').animate([{transform:'rotate(0deg)'},{transform:'rotate(90deg)'},{transform:'rotate(0deg)'}],{duration:300});
 });

 if (!reduced) {
   const ease = 'cubic-bezier(.2,.75,.25,1)';
   const timeline = [
     [$('logo'),[{opacity:0,transform:'translateY(-18px)'},{opacity:1,transform:'translateY(0)'}],{duration:420,easing:ease,fill:'forwards'}],
     [$('menu'),[{opacity:0,transform:'translateY(-18px)'},{opacity:1,transform:'translateY(0)'}],{duration:420,easing:ease,fill:'forwards',delay:80}],
     [$('eyebrow'),[{opacity:0,letterSpacing:'.9em'},{opacity:1,letterSpacing:'.46em'}],{duration:420,easing:ease,fill:'forwards',delay:280}],
     [$('headline'),[{opacity:0,filter:'blur(14px)',transform:'translateY(24px)'},{opacity:1,filter:'blur(0)',transform:'translateY(0)'}],{duration:650,easing:ease,fill:'forwards',delay:360}],
     [$('subtitle'),[{opacity:0,transform:'translateY(12px)'},{opacity:1,transform:'translateY(0)'}],{duration:420,easing:ease,fill:'forwards',delay:800}],
     [$('captions'),[{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'translateY(0)'}],{duration:420,easing:ease,fill:'forwards',delay:980}],
     [push,[{opacity:0,transform:'scale(.55)'},{opacity:1,transform:'scale(1)'}],{duration:480,easing:'cubic-bezier(.2,1.4,.4,1)',fill:'forwards',delay:1180}]
   ];
   timeline.forEach(([el,frames,opts]) => el.animate(frames,opts));
 } else {
   [$('logo'),$('menu'),$('eyebrow'),$('headline'),$('subtitle'),$('captions'),push].forEach(el=>{el.style.opacity='1';});
 }
})();
</script>
</body>
</html>
